name: PowerYield ML CI

on:
  push:
    branches: [main]
    paths:
      - "Mid-Term-Project/PowerYield-ML/**"
      - ".github/workflows/poweryield-ml-ci.yml"
  pull_request:
    paths:
      - "Mid-Term-Project/PowerYield-ML/**"
      - ".github/workflows/poweryield-ml-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Mid-Term-Project/PowerYield-ML

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Mid-Term-Project/PowerYield-ML/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Run API tests
        run: python -m pytest tests/ -v
